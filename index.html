<!DOCTYPE html>
<html>
    <head>
        <title>My Slider</title>
        <style>
            #slider {
                position: relative;
                width: 300px;
                height: 400px;
                margin: 0 auto;
            }

            #slider img {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: none;
            }

            #controls {
                margin-top: 20px;
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                color: #04a28d;
            }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #38011f;
        }
        </style>
    </head>
    <body>
        <h1>My Slider</h1>
        <div id="slider">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEFlx5Tsuaj2xZ1P2KTZndxqvpbm9tuyyHl7_oH64LeA&s=10" alt="Apple" height="400" width="300">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCNjwx0hOV3aM-QcRkQhH4RsS1yQf_11KOC4VrbeTaUw&s=10" alt="Ps6" height="400" width="300">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2DAlMifCvxuc1U6bVwChFJB8bCK7DDZVv4PPlHrHPrQ&s=10" alt="icecream" height="400" width="300">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQci0sWIauKjngb8B_dyLFAstgZnSSRVH7PxaZwVm2qeA&s=10" alt="car" height="400" width="300">
        </div>
        <div id="controls">
            <button onclick="changeImage(-1)"><</button>
            <button onclick="changeImage(1)">></button>
        </div>
        <script>
            let currentIndex = 0;
            const images = document.querySelectorAll('#slider img');

            function changeImage(direction) {
                images[currentIndex].style.display = 'none';
                currentIndex += direction;

                if (currentIndex < 0) {
                    currentIndex = images.length - 1;
                } else if (currentIndex >= images.length) {
                    currentIndex = 0;
                }

                images[currentIndex].style.display = 'block';
            }

           
            images.forEach((img, index) => {
                img.style.display = index === 0 ? 'block' : 'none';
            });
        </script>

  <img class="mySlides" src="https://img.freepik.com/free-photo/photorealistic-view-tree-nature-with-branches-trunk_23-2151478105.jpg" style="height:500px; width:400px;">
  <img class="mySlides" src="https://th.bing.com/th/id/OIP.IkW4w4j2ipeyzszq2dQ_BQHaEc?w=265&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" style="height:500px; width:400px;">
</section>

<script>

var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}
  x[myIndex-1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>

    </body>
</html>
